targets:
  $default:
    builders:
      drift_dev:
        options:
          # Usato da `dart run drift_dev make-migrations` per salvare gli schemi
          # di ogni versione (drift_schemas/) e generare i test delle migrazioni (test/drift/).
          databases:
            app_database: lib/data/db/app_database.dart
          schema_dir: drift_schemas/
          test_dir: test/drift/
