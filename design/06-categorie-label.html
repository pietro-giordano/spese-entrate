<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Categorie e label</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#16181D}a:hover{color:#000000}
button{font:inherit;cursor:pointer}
input{font:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; display: flex; flex-direction: column; overflow: hidden; background: #F7F7F5; font-family: Manrope, 'Helvetica Neue', sans-serif; color: #16181D">

  <div style="display: flex; flex-direction: column; gap: 14px; padding: 14px 20px 10px">
    <div style="display: flex; align-items: center; gap: 12px">
      <a href="07-impostazioni.html" aria-label="Indietro" style="width: 44px; height: 44px; box-sizing: border-box; border-radius: 14px; border: 1px solid #E4E4DF; background: #FFFFFF; color: #16181D; display: flex; align-items: center; justify-content: center">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"></path></svg>
      </a>
      <h1 style="margin: 0; font-size: 24px; font-weight: 800; letter-spacing: -0.02em">Categorie e label</h1>
    </div>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; padding: 4px; background: #E9E9E4; border-radius: 12px">
      <button onClick="{{setTabCat}}" style="height: 40px; border: 0; border-radius: 9px; font-size: 14px; font-weight: 800; {{tabCatStyle}}">Categorie</button>
      <button onClick="{{setTabLabel}}" style="height: 40px; border: 0; border-radius: 9px; font-size: 14px; font-weight: 800; {{tabLabelStyle}}">Label</button>
    </div>

    <sc-if value="{{isCat}}" hint-placeholder-val="{{ true }}">
      <div style="display: flex; gap: 6px">
        <button onClick="{{setSpese}}" style="height: 34px; padding: 0 14px; border-radius: 17px; border: 1px solid; font-size: 13px; font-weight: 700; {{speseStyle}}">Spese</button>
        <button onClick="{{setEntrate}}" style="height: 34px; padding: 0 14px; border-radius: 17px; border: 1px solid; font-size: 13px; font-weight: 700; {{entrateStyle}}">Entrate</button>
      </div>
    </sc-if>
  </div>

  <div style="flex: 1; overflow-y: auto; padding: 4px 20px 16px; display: flex; flex-direction: column; gap: 12px">
    <div style="font-size: 12px; font-weight: 600; color: #5B5F66">{{hint}}</div>
    <div style="background: #FFFFFF; border: 1px solid #E4E4DF; border-radius: 18px; overflow: hidden">
      <sc-for list="{{items}}" as="it" hint-placeholder-count="7">
        <div style="display: flex; align-items: center; gap: 12px; padding: 6px 6px 6px 14px; border-top: {{it.border}}">
          <div style="width: 36px; height: 36px; flex: none; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 800; color: #FFFFFF; background: {{it.color}}">{{it.initial}}</div>
          <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px">
            <div style="font-size: 15px; font-weight: 700">{{it.name}}</div>
            <div style="font-size: 12px; font-weight: 600; color: #5B5F66">{{it.count}}</div>
          </div>
          <button onClick="{{it.edit}}" aria-label="Modifica" style="width: 44px; height: 44px; border: 0; background: transparent; color: #4B4F56; display: flex; align-items: center; justify-content: center">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"></path></svg>
          </button>
          <div aria-hidden="true" style="width: 24px; display: flex; justify-content: center; color: #A3A6AC">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M9 6h.01M15 6h.01M9 12h.01M15 12h.01M9 18h.01M15 18h.01"></path></svg>
          </div>
        </div>
      </sc-for>
    </div>
    <button onClick="{{addNew}}" style="height: 52px; border-radius: 16px; border: 1px dashed #A3A6AC; background: transparent; color: #16181D; font-size: 15px; font-weight: 800">{{addLabel}}</button>
  </div>

  <sc-if value="{{isEditing}}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; inset: 0; background: rgba(17,19,22,0.45); display: flex; flex-direction: column; justify-content: flex-end">
      <div style="background: #FFFFFF; border-radius: 24px 24px 0 0; padding: 10px 20px 22px; display: flex; flex-direction: column; gap: 16px">
        <div style="width: 40px; height: 5px; border-radius: 3px; background: #DCDCD6; align-self: center"></div>
        <div style="display: flex; align-items: center; justify-content: space-between">
          <div style="font-size: 18px; font-weight: 800">{{sheetTitle}}</div>
          <button onClick="{{close}}" aria-label="Chiudi" style="width: 44px; height: 44px; border: 0; background: transparent; color: #16181D; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"></path></svg></button>
        </div>
        <div style="display: flex; flex-direction: column; gap: 6px">
          <label for="m-name" style="font-size: 12px; font-weight: 700; color: #5B5F66; text-transform: uppercase; letter-spacing: 0.06em">Nome</label>
          <input id="m-name" type="text" value="{{editName}}" style="height: 46px; box-sizing: border-box; padding: 0 14px; border-radius: 12px; border: 1px solid #DCDCD6; background: #FFFFFF; color: #16181D; font-size: 15px; font-weight: 700">
        </div>
        <div style="display: flex; flex-direction: column; gap: 8px">
          <div style="font-size: 12px; font-weight: 700; color: #5B5F66; text-transform: uppercase; letter-spacing: 0.06em">Colore</div>
          <div style="display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 6px">
            <sc-for list="{{swatches}}" as="sw" hint-placeholder-count="8">
              <button onClick="{{sw.pick}}" aria-label="{{sw.aria}}" style="height: 36px; border-radius: 10px; background: {{sw.color}}; {{sw.ring}}"></button>
            </sc-for>
          </div>
        </div>
        <div style="display: flex; flex-direction: column; gap: 6px">
          <div style="font-size: 12px; font-weight: 700; color: #5B5F66; text-transform: uppercase; letter-spacing: 0.06em">Movimenti collegati</div>
          <div style="font-size: 13px; font-weight: 600; color: #3D4148; line-height: 1.45">{{editInfo}}</div>
          <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
            <button style="height: 44px; border-radius: 12px; border: 1px solid #DCDCD6; background: #FFFFFF; color: #16181D; font-size: 13px; font-weight: 700">Unisci in…</button>
            <button style="height: 44px; border-radius: 12px; border: 1px solid #F3C9B3; background: #FFFFFF; color: #B4410C; font-size: 13px; font-weight: 700">Archivia</button>
          </div>
        </div>
        <button onClick="{{close}}" style="height: 54px; border-radius: 16px; border: 0; background: #16181D; color: #FFFFFF; font-size: 16px; font-weight: 800">Salva</button>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { tab: 'cat', kind: 'spese', editing: null, color: null };
  }
  renderVals() {
    const s = this.state;
    const SW = ['#1D4ED8', '#C2410C', '#0F5F58', '#7C3AED', '#B45309', '#BE185D', '#4D7C0F', '#475569'];
    const DATA = {
      spese: [['Spesa alimentare', 48, 1], ['Casa', 14, 0], ['Trasporti', 22, 2], ['Ristoranti', 31, 3], ['Svago', 12, 4], ['Salute', 6, 5], ['Abbonamenti', 18, 7], ['Altro', 9, 7]],
      entrate: [['Stipendio', 9, 0], ['Freelance', 7, 2], ['Rimborsi', 4, 6], ['Regali', 2, 5], ['Altro', 3, 7]],
      label: [['#ricorrente', 41, 7], ['#casa', 52, 0], ['#lavoro', 27, 2], ['#condivisa', 15, 3], ['#vacanze', 11, 4], ['#auto', 19, 1]]
    };
    const isCat = s.tab === 'cat';
    const src = isCat ? DATA[s.kind] : DATA.label;
    const items = src.map((r, i) => ({
      name: r[0],
      initial: r[0].replace('#', '').charAt(0).toUpperCase(),
      count: r[1] + ' movimenti',
      color: SW[r[2]],
      border: i === 0 ? '0' : '1px solid #EFEFEA',
      edit: () => this.setState({ editing: { name: r[0], count: r[1] }, color: SW[r[2]] })
    }));
    const on = 'background:#FFFFFF;color:#16181D;box-shadow:0 1px 2px rgba(0,0,0,.10)';
    const off = 'background:transparent;color:#4B4F56';
    const chipOn = 'background:#16181D;color:#FFFFFF;border-color:#16181D';
    const chipOff = 'background:#FFFFFF;color:#16181D;border-color:#DCDCD6';
    const ed = s.editing;
    const isNew = ed && ed.count === 0;
    const swatches = SW.map((c, i) => ({
      color: c,
      aria: 'Colore ' + (i + 1),
      ring: c === s.color ? 'border: 3px solid #FFFFFF; box-shadow: 0 0 0 2px #16181D' : 'border: 0',
      pick: () => this.setState({ color: c })
    }));
    return {
      isCat,
      items,
      hint: isCat ? 'Tieni premuto e trascina per riordinare: l’ordine è quello dell’inserimento rapido.' : 'Le label sono condivise tra spese ed entrate. Un movimento può averne più di una.',
      addLabel: isCat ? '+ Nuova categoria' : '+ Nuova label',
      addNew: () => this.setState({ editing: { name: '', count: 0 }, color: SW[0] }),
      tabCatStyle: isCat ? on : off,
      tabLabelStyle: !isCat ? on : off,
      speseStyle: s.kind === 'spese' ? chipOn : chipOff,
      entrateStyle: s.kind === 'entrate' ? chipOn : chipOff,
      setTabCat: () => this.setState({ tab: 'cat' }),
      setTabLabel: () => this.setState({ tab: 'label' }),
      setSpese: () => this.setState({ kind: 'spese' }),
      setEntrate: () => this.setState({ kind: 'entrate' }),
      isEditing: !!ed,
      sheetTitle: isNew ? (isCat ? 'Nuova categoria' : 'Nuova label') : (isCat ? 'Modifica categoria' : 'Modifica label'),
      editName: ed ? ed.name : '',
      editInfo: isNew ? 'Nessun movimento collegato.' : (ed ? ed.count + ' movimenti usano questa voce. Per eliminarla puoi unirla a un’altra oppure archiviarla: i movimenti esistenti restano invariati.' : ''),
      swatches,
      close: () => this.setState({ editing: null })
    };
  }
}
</script>
</body>
</html>
