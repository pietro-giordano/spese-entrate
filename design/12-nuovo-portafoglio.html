<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Nuovo portafoglio</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#16181D}a:hover{color:#000000}
button{font:inherit;cursor:pointer}
input{font:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; overflow: hidden; background: #F7F7F5; font-family: Manrope, 'Helvetica Neue', sans-serif; color: #16181D">
  <div style="display: flex; align-items: center; justify-content: space-between; padding: 14px 20px 10px">
    <a href="10-portafogli.html" aria-label="Chiudi" style="width: 44px; height: 44px; box-sizing: border-box; border-radius: 14px; border: 1px solid #E4E4DF; background: #FFFFFF; color: #16181D; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"></path></svg>
    </a>
    <div style="font-size: 16px; font-weight: 800">Nuovo portafoglio</div>
    <span style="width: 44px"></span>
  </div>

  <div style="flex: 1; overflow-y: auto; padding: 4px 20px 20px; display: flex; flex-direction: column; gap: 20px">
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="w-name" style="font-size: 12px; font-weight: 700; color: #5B5F66; text-transform: uppercase; letter-spacing: 0.06em">Nome</label>
      <input id="w-name" type="text" placeholder="Es. Conto Banca, Portafoglio, Broker" style="height: 50px; box-sizing: border-box; padding: 0 14px; border-radius: 12px; border: 1px solid #DCDCD6; background: #FFFFFF; color: #16181D; font-size: 15px; font-weight: 600">
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <div style="font-size: 12px; font-weight: 700; color: #5B5F66; text-transform: uppercase; letter-spacing: 0.06em">Tipo</div>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
        <sc-for list="{{types}}" as="t" hint-placeholder-count="6">
          <button onClick="{{t.pick}}" aria-pressed="{{t.aria}}" style="height: 78px; border-radius: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; font-size: 12px; font-weight: 700; {{t.style}}">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="{{t.icon}}"></path></svg>{{t.label}}
          </button>
        </sc-for>
      </div>
      <sc-if value="{{isManual}}" hint-placeholder-val="{{ false }}">
        <div style="font-size: 12px; font-weight: 600; color: #3D4148; line-height: 1.45; padding: 10px 12px; border-radius: 12px; background: #EAE2FB">Il valore di un investimento cambia anche senza movimenti: aggiornalo dal dettaglio del portafoglio con "Aggiorna saldo". Ti avviseremo se non lo aggiorni da più di 30 giorni.</div>
      </sc-if>
    </div>

    <div style="display: grid; grid-template-columns: 1.4fr 1fr; gap: 10px">
      <div style="display: flex; flex-direction: column; gap: 6px">
        <label for="w-bal" style="font-size: 12px; font-weight: 700; color: #5B5F66; text-transform: uppercase; letter-spacing: 0.06em">Saldo iniziale</label>
        <div style="display: flex; align-items: center; gap: 6px; height: 50px; padding: 0 12px; border-radius: 12px; border: 1px solid #DCDCD6; background: #FFFFFF; box-sizing: border-box">
          <span style="font-size: 16px; font-weight: 700">€</span>
          <input id="w-bal" type="text" inputmode="decimal" placeholder="0,00" style="flex: 1; min-width: 0; border: 0; background: transparent; color: #16181D; font-size: 16px; font-weight: 800">
        </div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <span style="font-size: 12px; font-weight: 700; color: #5B5F66; text-transform: uppercase; letter-spacing: 0.06em">Alla data</span>
        <button style="height: 50px; border-radius: 12px; border: 1px solid #DCDCD6; background: #FFFFFF; color: #16181D; font-size: 15px; font-weight: 700">Oggi</button>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <div style="font-size: 12px; font-weight: 700; color: #5B5F66; text-transform: uppercase; letter-spacing: 0.06em">Uso</div>
      <div style="background: #FFFFFF; border: 1px solid #E4E4DF; border-radius: 18px; overflow: hidden">
        <sc-for list="{{toggles}}" as="tg" hint-placeholder-count="3">
          <div style="display: flex; align-items: center; gap: 12px; min-height: 62px; padding: 8px 14px; border-top: {{tg.border}}">
            <div style="flex: 1; display: flex; flex-direction: column; gap: 2px">
              <span style="font-size: 15px; font-weight: 700">{{tg.title}}</span>
              <span style="font-size: 12px; font-weight: 600; color: #5B5F66; line-height: 1.4">{{tg.sub}}</span>
            </div>
            <button onClick="{{tg.flip}}" role="switch" aria-checked="{{tg.aria}}" aria-label="{{tg.title}}" style="width: 52px; height: 32px; flex: none; border: 0; border-radius: 16px; padding: 3px; display: flex; {{tg.track}}">
              <span style="width: 26px; height: 26px; border-radius: 13px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(0,0,0,.25)"></span>
            </button>
          </div>
        </sc-for>
      </div>
    </div>
  </div>

  <div style="padding: 12px 20px 20px; border-top: 1px solid #E4E4DF; background: #FFFFFF">
    <a href="10-portafogli.html" style="height: 56px; border-radius: 16px; background: #16181D; color: #FFFFFF; display: flex; align-items: center; justify-content: center; text-decoration: none; font-size: 16px; font-weight: 800">Crea portafoglio</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { type: 'inv', out: false, inc: false, total: true };
  }
  renderVals() {
    const s = this.state;
    const T = [
      ['cash', 'Contanti', 'M4 6h16a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2zM12 9.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5zM6 12h.01M18 12h.01'],
      ['bank', 'Conto corrente', 'M3 21h18M5 21V10M19 21V10M9 21V10M15 21V10M2 10l10-6 10 6'],
      ['card', 'Carta', 'M4 5h16a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2zM2 10h20'],
      ['save', 'Risparmio', 'M5 7h14a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2zM8 7V5a4 4 0 0 1 8 0v2'],
      ['inv', 'Investimenti', 'm3 17 6-6 4 4 8-8M14 7h7v7'],
      ['other', 'Altro', 'M19 7V5a2 2 0 0 0-2-2H5a2 2 0 0 0 0 4h14a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5M16 14h.01']
    ];
    const types = T.map((t) => {
      const on = s.type === t[0];
      return { label: t[1], icon: t[2], aria: on ? 'true' : 'false',
        style: on ? 'border:2px solid #16181D;background:#FFFFFF;color:#16181D' : 'border:1px solid #DCDCD6;background:#FFFFFF;color:#4B4F56',
        pick: () => this.setState({ type: t[0] }) };
    });
    const mk = (key, title, sub, i) => ({
      title, sub, aria: s[key] ? 'true' : 'false',
      track: s[key] ? 'background:#1D4ED8;justify-content:flex-end' : 'background:#C9CBC4;justify-content:flex-start',
      border: i === 0 ? '0' : '1px solid #EFEFEA',
      flip: () => this.setState({ [key]: !this.state[key] })
    });
    return {
      types,
      isManual: s.type === 'inv',
      toggles: [
        mk('out', 'Predefinito per le spese', s.out ? 'Le nuove spese partiranno da qui' : 'Ora: Conto corrente', 0),
        mk('inc', 'Predefinito per le entrate', s.inc ? 'Le nuove entrate arriveranno qui' : 'Ora: Conto corrente', 1),
        mk('total', 'Includi nel patrimonio', 'Conta nel totale della schermata Portafogli', 2)
      ]
    };
  }
}
</script>
</body>
</html>
