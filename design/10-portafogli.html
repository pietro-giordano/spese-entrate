<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Portafogli</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#16181D}a:hover{color:#000000}
button{font:inherit;cursor:pointer}
input{font:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; overflow: hidden; background: #F7F7F5; font-family: Manrope, 'Helvetica Neue', sans-serif; color: #16181D; font-variant-numeric: tabular-nums">
  <div style="flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; padding: 20px 20px 20px">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <h1 style="margin: 0; font-size: 28px; font-weight: 800; letter-spacing: -0.02em">Portafogli</h1>
      <a href="12-nuovo-portafoglio.html" aria-label="Nuovo portafoglio" style="width: 44px; height: 44px; box-sizing: border-box; border-radius: 14px; border: 1px solid #E4E4DF; background: #FFFFFF; color: #16181D; display: flex; align-items: center; justify-content: center">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
      </a>
    </div>

    <div style="background: #FFFFFF; border: 1px solid #E4E4DF; border-radius: 20px; padding: 18px; display: flex; flex-direction: column; gap: 14px">
      <div style="display: flex; flex-direction: column; gap: 2px">
        <div style="font-size: 13px; font-weight: 600; color: #5B5F66">Patrimonio totale</div>
        <div style="font-size: 34px; font-weight: 800; letter-spacing: -0.02em">{{total}}</div>
      </div>
      <div style="display: flex; height: 10px; border-radius: 5px; overflow: hidden; gap: 2px">
        <sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
          <div style="height: 10px; width: {{g.pct}}; background: {{g.color}}"></div>
        </sc-for>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
          <div style="display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600">
            <span style="width: 10px; height: 10px; border-radius: 3px; background: {{g.color}}"></span>
            <span style="flex: 1; color: #3D4148">{{g.title}}</span>
            <span style="font-weight: 800">{{g.total}}</span>
          </div>
        </sc-for>
      </div>
    </div>

    <a href="02-inserimento-rapido.html" style="height: 50px; border-radius: 16px; background: #16181D; color: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; font-size: 15px; font-weight: 800">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4 3 8l4 4M3 8h14M17 20l4-4-4-4M21 16H7"></path></svg>Trasferisci tra portafogli
    </a>

    <sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
      <div style="display: flex; flex-direction: column; gap: 8px">
        <div style="display: flex; justify-content: space-between; font-size: 12px; font-weight: 700; color: #5B5F66; text-transform: uppercase; letter-spacing: 0.06em">
          <span>{{g.title}}</span><span>{{g.total}}</span>
        </div>
        <div style="background: #FFFFFF; border: 1px solid #E4E4DF; border-radius: 18px; overflow: hidden">
          <sc-for list="{{g.items}}" as="w" hint-placeholder-count="2">
            <a href="11-dettaglio-portafoglio.html" style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-top: {{w.border}}; text-decoration: none; color: #16181D">
              <div style="width: 40px; height: 40px; flex: none; border-radius: 12px; display: flex; align-items: center; justify-content: center; background: {{g.tileBg}}; color: {{g.tileFg}}">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="{{w.icon}}"></path></svg>
              </div>
              <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px">
                <div style="font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{w.name}}</div>
                <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px">
                  <span style="font-size: 12px; font-weight: 600; color: #5B5F66">{{w.updated}}</span>
                  <sc-for list="{{w.badges}}" as="b" hint-placeholder-count="1">
                    <span style="height: 20px; padding: 0 7px; border-radius: 10px; font-size: 11px; font-weight: 800; display: flex; align-items: center; {{b.style}}">{{b.text}}</span>
                  </sc-for>
                </div>
              </div>
              <div style="font-size: 15px; font-weight: 800">{{w.amount}}</div>
            </a>
          </sc-for>
        </div>
      </div>
    </sc-for>
    <div style="font-size: 12px; font-weight: 600; color: #5B5F66; line-height: 1.45">I trasferimenti spostano denaro tra portafogli: non contano come entrate o spese nei grafici.</div>
  </div>
  <nav style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: #FFFFFF; border-top: 1px solid #E4E4DF; padding: 4px 8px 14px">
    <a href="01-movimenti.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 8px 0; text-decoration: none; color: #5B5F66; font-size: 12px; font-weight: 600">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"></path></svg>Movimenti
    </a>
    <a href="10-portafogli.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 8px 0; text-decoration: none; color: #16181D; font-size: 12px; font-weight: 800">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 7V5a2 2 0 0 0-2-2H5a2 2 0 0 0 0 4h14a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5"></path><path d="M16 14h.01"></path></svg>Portafogli
    </a>
    <a href="04-grafici.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 8px 0; text-decoration: none; color: #5B5F66; font-size: 12px; font-weight: 600">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.2 15.9A10 10 0 1 1 8 2.8"></path><path d="M22 12A10 10 0 0 0 12 2v10z"></path></svg>Grafici
    </a>
    <a href="05-confronta.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 8px 0; text-decoration: none; color: #5B5F66; font-size: 12px; font-weight: 600">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"></path><path d="M7 16v-5M12 16V7M17 16v-3"></path></svg>Confronta
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const eur = (n) => { const p = n.toFixed(2).split('.'); return '€ ' + p[0].replace(/\B(?=(\d{3})+(?!\d))/g, '.') + ',' + p[1]; };
    const IC = {
      bank: 'M3 21h18M5 21V10M19 21V10M9 21V10M15 21V10M2 10l10-6 10 6',
      cash: 'M4 6h16a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2zM12 9.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5zM6 12h.01M18 12h.01',
      card: 'M4 5h16a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2zM2 10h20',
      save: 'M5 7h14a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2zM8 7V5a4 4 0 0 1 8 0v2',
      inv: 'm3 17 6-6 4 4 8-8M14 7h7v7'
    };
    const DEF = 'background:#DCE5FB;color:#1E3A8A';
    const STALE = 'background:#FCE9DF;color:#9A3412';
    const raw = [
      { title: 'Liquidità', color: '#1D4ED8', tileBg: '#DCE5FB', tileFg: '#1E3A8A', items: [
        { name: 'Conto corrente', amount: 4218.35, icon: IC.bank, updated: 'Aggiornato oggi', badges: [{ text: 'Predefinito spese ed entrate', style: DEF }] },
        { name: 'Contanti', amount: 86.5, icon: IC.cash, updated: 'Aggiornato il 28 set', badges: [] },
        { name: 'Carta prepagata', amount: 152, icon: IC.card, updated: 'Aggiornato il 2 ott', badges: [] }
      ] },
      { title: 'Risparmi', color: '#0F5F58', tileBg: '#D5ECE9', tileFg: '#0F5F58', items: [
        { name: 'Conto deposito', amount: 5000, icon: IC.save, updated: 'Aggiornato il 30 set', badges: [] }
      ] },
      { title: 'Investimenti', color: '#7C3AED', tileBg: '#EAE2FB', tileFg: '#5B21B6', items: [
        { name: 'ETF [broker]', amount: 12480, icon: IC.inv, updated: 'Aggiornato il 30 set', badges: [] },
        { name: 'Fondo pensione', amount: 7920, icon: IC.inv, updated: 'Aggiornato il 31 ago', badges: [{ text: 'Da aggiornare', style: STALE }] }
      ] }
    ];
    const grand = raw.reduce((a, g) => a + g.items.reduce((b, w) => b + w.amount, 0), 0);
    const groups = raw.map((g) => {
      const t = g.items.reduce((b, w) => b + w.amount, 0);
      return { ...g, total: eur(t), pct: ((t / grand) * 100).toFixed(1) + '%',
        items: g.items.map((w, i) => ({ ...w, amount: eur(w.amount), border: i === 0 ? '0' : '1px solid #EFEFEA' })) };
    });
    return { total: eur(grand), groups };
  }
}
</script>
</body>
</html>
