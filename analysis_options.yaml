# Regole di analisi statica: https://dart.dev/tools/analysis
include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    # File generati da build_runner (drift, freezed, json_serializable, riverpod).
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - build/**
    - android/**
    - ios/**
  language:
    strict-casts: true
    strict-raw-types: true

formatter:
  page_width: 120

linter:
  rules:
    prefer_single_quotes: true
    prefer_final_locals: true
    always_declare_return_types: true
    avoid_print: true
    require_trailing_commas: false
